name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/qris-gopay.jpg'
      - 'plugins/designku/systems/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp assets/qris-gopay.jpg _site/qris-gopay.jpg
          # Live previews of every built-in designku system: /designku/<id>/
          for dir in plugins/designku/systems/*/; do
            id="$(basename "$dir")"
            if [ -f "$dir/preview.html" ]; then
              mkdir -p "_site/designku/$id"
              cp "$dir/preview.html" "_site/designku/$id/index.html"
              cp "$dir/tokens.json" "_site/designku/$id/tokens.json"
            fi
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
